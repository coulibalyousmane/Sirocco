name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le depot
        uses: actions/checkout@v4

      - name: Installer .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restaurer
        run: dotnet restore Sirocco.sln

      - name: Compiler (Release)
        run: dotnet build Sirocco.sln --configuration Release --no-restore

      - name: Tests unitaires avec collecte de couverture
        # coverlet.collector etait reference par Sirocco.UnitTests.csproj depuis toujours sans
        # qu'aucune etape ne s'en serve : des tests verts, sans savoir quelles branches etaient
        # exercees. C'est ce --collect qui ferme l'ecart.
        run: >
          dotnet test tests/Sirocco.UnitTests --configuration Release --no-build
          --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Restaurer les outils dotnet
        run: dotnet tool restore

      - name: Publier la couverture dans le resume du run, et la faire mordre
        # Deux sorties depuis le meme Cobertura : un tableau markdown pousse dans le resume du run
        # (le chiffre est lu sans avoir a ouvrir un artefact) et un Summary.json machine-lisible qui
        # sert de verdict.
        #
        # Pas de Codecov ni de Coveralls, et ce n'est pas une preference : ci.yml ne reference
        # aujourd'hui aucun secret, donc son declencheur `pull_request` ne peut rien exfiltrer
        # depuis un fork. Ajouter un jeton d'envoi a un service tiers detruirait precisement cette
        # propriete, sur un depot public, pour afficher un chiffre que le resume du run donne deja.
        run: |
          dotnet reportgenerator \
            "-reports:coverage/**/coverage.cobertura.xml" \
            "-targetdir:coverage/report" \
            "-reporttypes:MarkdownSummaryGithub;JsonSummary;Html"
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

          # awk et non jq : jq est bien present sur les runners Ubuntu, mais absent du Git Bash ou
          # cette etape a ete mise au point, donc inverifiable en local. `"linecoverage"` n'apparait
          # qu'une seule fois dans Summary.json (mesure verifiee : 1 occurrence contre 209 pour
          # `"branchcoverage"`, qui existe aussi par classe) — la lecture est donc sans ambiguite.
          lire() {
            awk -v cle="\"$1\"" '
              index($0, cle) { gsub(/[^0-9.]/, "", $2); print $2; exit }
            ' coverage/report/Summary.json
          }
          LIGNES=$(lire linecoverage)
          # Premiere occurrence : le bloc de synthese precede les classes dans le fichier.
          BRANCHES=$(lire branchcoverage)
          echo "Couverture mesuree : $LIGNES % de lignes, $BRANCHES % de branches (plancher : $PLANCHER %)."

          # Un plancher, pas une cible. Il existe pour empecher le constat de retomber a l'etat
          # ou l'audit l'a trouve — mesurable mais jamais mesure — pas pour reclamer un chiffre
          # plus flatteur. Il est volontairement sous la mesure reelle (70,8 % en Release) : il doit
          # attraper la disparition des tests d'un sous-systeme, pas signaler la variation normale
          # d'un runner partage. A relever quand une base mesuree sous Linux existera.
          awk -v v="$LIGNES" -v p="$PLANCHER" 'BEGIN {
            if (v + 0 < p + 0) {
              printf "La couverture de lignes est tombee a %s %%, sous le plancher de %s %%.\n", v, p
              printf "Le rapport HTML detaille est publie en artefact du run (couverture-html).\n"
              exit 1
            }
          }'
        env:
          PLANCHER: "65"

      - name: Publier le rapport de couverture detaille
        # Le tableau du resume dit *combien*, ce rapport dit *ou* : c'est ce qui rend la mesure
        # actionnable plutot que decorative. `always()` pour qu'il soit la surtout quand la
        # barriere ci-dessus vient d'echouer.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-html
          path: coverage/report
          retention-days: 14

      - name: Empaqueter Sirocco.Cli (outil dotnet)
        run: dotnet pack src/Sirocco.Cli --configuration Release --no-build

      - name: Empaqueter les paquets NuGet bibliotheque
        run: |
          dotnet pack src/Sirocco.Domain --configuration Release --no-build
          dotnet pack src/Sirocco.Application --configuration Release --no-build
          dotnet pack src/Sirocco.Infrastructure --configuration Release --no-build
          dotnet pack src/Sirocco.Scenarios --configuration Release --no-build

      - name: Verifier le formatage
        run: dotnet format Sirocco.sln --verify-no-changes --severity info

  # AUDIT-MATURITE.md, M4. release.yml publie quatre binaires autonomes (win-x64, linux-x64,
  # osx-x64, osx-arm64), et les quatre jobs de cette CI tournaient tous sur ubuntu-latest : deux des
  # quatre n'avaient jamais ete executes par personne, ni par une machine ni a la main. Expedier a un
  # inconnu sur Mac un binaire jamais lance, c'est jouer son premier contact - et le premier contact
  # ne se rejoue pas.
  #
  # Ce job ne duplique pas build-and-test : il exerce le chemin de PUBLICATION self-contained en
  # fichier unique, que rien ne verifiait, sur aucune plateforme. C'est precisement la zone ou un bug
  # de packaging par RID a deja casse la CI (commit a01498d, voir le commentaire de
  # Sirocco.Cli.csproj). La couverture et son plancher restent l'affaire du seul job Ubuntu : les
  # dupliquer trois fois ne mesurerait rien de plus.
  #
  # Le fumigene est `--version` (M3) : aucune cible, aucun reseau, aucun scenario a fournir. Il ne
  # prouve pas que le tir fonctionne, il prouve que le binaire DEMARRE sur cette plateforme - ce que
  # rien ne prouvait.
  #
  # fail-fast: false pour que l'echec d'une plateforme ne masque pas le resultat des deux autres.
  binaires-par-plateforme:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            binaire: sirocco
          - os: windows-latest
            rid: win-x64
            binaire: sirocco.exe
          # macos-latest est arm64 : osx-arm64 est donc execute nativement. osx-x64 reste
          # cross-compile sans etre lance (Rosetta n'est pas un socle de verification fiable) -
          # limite residuelle assumee, et bien plus petite que "les deux binaires macOS".
          - os: macos-latest
            rid: osx-arm64
            binaire: sirocco
    runs-on: ${{ matrix.os }}
    steps:
      - name: Cloner le depot
        uses: actions/checkout@v4

      - name: Installer .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Tests unitaires
        run: dotnet test tests/Sirocco.UnitTests --configuration Release

      - name: Publier le binaire autonome
        run: >
          dotnet publish src/Sirocco.Cli --configuration Release
          --runtime ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish-${{ matrix.rid }}

      - name: Executer le binaire publie
        shell: bash
        run: |
          set -euo pipefail
          binaire="publish-${{ matrix.rid }}/${{ matrix.binaire }}"
          chmod +x "$binaire" || true
          sortie=$("$binaire" --version)
          echo "$sortie"
          echo "$sortie" | grep -q "^sirocco 0\." \
            || { echo "::error::Le binaire ${{ matrix.rid }} n'a pas rapporte sa version." >&2; exit 1; }

  # Les deux projets .NET du harnais de benchmark sont volontairement hors de Sirocco.sln (voir le
  # commentaire en tete de benchmark/nbomber/NBomberCheckout.csproj : NBomber est sous licence
  # commerciale, payante pour un usage organisationnel, et n'a rien a faire dans le restore/build
  # du depot entier). Consequence non voulue : le `dotnet format Sirocco.sln` de build-and-test ne
  # les voyait pas, et chacun avait accumule des violations en silence (CHARSET + FINALNEWLINE, et
  # quatre IDE00xx dans benchmark/normalize). Job dedie plutot que les ajouter a la solution : le
  # format est verifie, sans que le build principal ni les paquets publies ne tirent jamais NBomber.
  format-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le depot
        uses: actions/checkout@v4

      - name: Installer .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Verifier le formatage du harnais de benchmark
        # Un projet par appel : `dotnet format` prend une solution ou un projet, pas une liste.
        run: |
          dotnet format benchmark/normalize --verify-no-changes --severity info
          dotnet format benchmark/nbomber --verify-no-changes --severity info

  smoke-e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    # Un vrai tir, pas seulement des tests unitaires : c'est ce qui a deja revele des bugs
    # reels dans ce projet (limite Kestrel HTTP/1.1+2, UriFormatException sur "+", propagation
    # de TargetUri en mode distribue) qu'aucun test isole n'aurait trouves. Seuils volontairement
    # larges (P95 < 1000ms) : ce job verifie que la chaine seuils -> code de sortie fonctionne en
    # CI, pas la performance elle-meme, qui varie trop d'un runner partage a l'autre pour un seuil serre.
    steps:
      - name: Cloner le depot
        uses: actions/checkout@v4

      - name: Installer .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Compiler la cible de demonstration et l'hote (Release)
        run: |
          dotnet build samples/Sirocco.SampleTarget --configuration Release
          dotnet build src/Sirocco.Host --configuration Release

      - name: Demarrer Sirocco.SampleTarget en arriere-plan
        run: |
          nohup dotnet samples/Sirocco.SampleTarget/bin/Release/net10.0/Sirocco.SampleTarget.dll > sampletarget.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5281/api/catalog/products > /dev/null && exit 0
            sleep 1
          done
          echo "Sirocco.SampleTarget n'a jamais repondu :"
          cat sampletarget.log
          exit 1
        env:
          ASPNETCORE_URLS: http://localhost:5281
          SampleTarget__GrpcPort: "5287"

      - name: Tir de fumee avec seuils CI (echoue si la chaine seuils/code de sortie casse)
        run: dotnet src/Sirocco.Host/bin/Release/net10.0/Sirocco.Host.dll
        env:
          ASPNETCORE_URLS: http://localhost:5299
          Sirocco__TargetBaseUrl: http://localhost:5281
          Sirocco__MaxVirtualUsers: "20"
          Sirocco__ExitAfterRun: "true"
          Sirocco__Profile__0__FromRps: "0"
          Sirocco__Profile__0__ToRps: "10"
          Sirocco__Profile__0__DurationSeconds: "5"
          Sirocco__Profile__1__FromRps: "10"
          Sirocco__Profile__1__ToRps: "10"
          Sirocco__Profile__1__DurationSeconds: "10"
          Sirocco__Profile__2__FromRps: "10"
          Sirocco__Profile__2__ToRps: "0"
          Sirocco__Profile__2__DurationSeconds: "3"
          Sirocco__Thresholds__0__StepName: "__iteration"
          Sirocco__Thresholds__0__Metric: "ResponseP95Milliseconds"
          Sirocco__Thresholds__0__Comparison: "LessThan"
          Sirocco__Thresholds__0__Limit: "1000"
          Sirocco__Thresholds__1__StepName: "__iteration"
          Sirocco__Thresholds__1__Metric: "ErrorRate"
          Sirocco__Thresholds__1__Comparison: "LessThanOrEqual"
          Sirocco__Thresholds__1__Limit: "0.01"

      - name: Tir de fumee avec le binaire autonome linux-x64 (verifie la publication self-contained)
        run: |
          dotnet publish src/Sirocco.Cli --configuration Release --runtime linux-x64 \
            --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -o publish/linux-x64
          chmod +x publish/linux-x64/sirocco
          ./publish/linux-x64/sirocco run --target-url http://localhost:5281 --rps 10 --duration 5s

      - name: Tir de fumee d'un scenario scripte (verifie le moteur Roslyn de la phase 2)
        # Depend du framework, pas le binaire self-contained fichier unique publie ci-dessus :
        # un scenario scripte a besoin du chemin sur disque des assemblies chargees pour
        # resoudre ses references (Assembly.Location), qui n'existe pas dans un bundle fichier
        # unique — ScriptedWorkflowLoader le rejette explicitement (NotSupportedException) plutot
        # que d'echouer silencieusement. C'est un IL3000/echec de publication qui a casse ce job
        # une premiere fois avant d'etre trouve et corrige ici.
        run: |
          dotnet build src/Sirocco.Cli --configuration Release -o build/framework-dependent
          dotnet build/framework-dependent/sirocco.dll run scenarios/scripted-checkout.csx \
            --target-url http://localhost:5281 --rps 15 --duration 5s --max-vus 10

      - name: Tir reel de chaque scenario d'exemple de la documentation
        # Ce qui rend "exemples executables" verifie plutot que declaratif : chaque scenario
        # transclus par une page du site est reellement joue ici, avec un seuil sur le taux
        # d'erreur — sans seuil, sirocco run sortirait 0 meme a 100 % d'echec et la CI
        # validerait un exemple casse.
        #
        # SIROCCO_DEMO_API_TOKEN nourrit variables-environnement.yaml ({{env.SIROCCO_DEMO_API_TOKEN}}).
        # Si cette variable manquait, la substitution echouerait a chaque iteration et le seuil
        # d'erreur ci-dessous ferait echouer ce job : c'est la preuve que la substitution a
        # reellement lieu, pas une supposition. --allow-env l'autorise explicitement : depuis
        # SEC-9 (AUDIT.md), {{env.NOM}} est refuse au chargement du scenario sans cette
        # autorisation, meme pour un scenario qui ne l'utiliserait pas (les autres exemples de la
        # boucle l'ignorent simplement).
        run: |
          for f in docs/examples/scenarios/*.yaml; do
            echo "::group::$f"
            dotnet build/framework-dependent/sirocco.dll run "$f" \
              --target-url http://localhost:5281 --rps 10 --duration 5s --max-vus 40 \
              --threshold "__iteration:ErrorRate:LessThanOrEqual:0.01" \
              --allow-env SIROCCO_DEMO_API_TOKEN
            echo "::endgroup::"
          done
        env:
          SIROCCO_DEMO_API_TOKEN: "ci-demo-token"

      - name: Tir reel de chaque fragment de configuration de la documentation
        # Sirocco.Host n'a pas d'option pour designer un fichier de configuration : il lit
        # appsettings.<environnement>.json de sa racine de contenu. Le chemin doit etre absolu
        # (un chemin relatif est resolu depuis le dossier du binaire) ; le repertoire courant
        # reste la racine du depot, ce dont dependent les ScenarioFile de l'exemple a scenarios
        # concurrents. Chaque fragment porte ses propres seuils et ExitAfterRun : le code de
        # sortie est donc un vrai verdict.
        run: |
          for environment in seuils-ci scenarios-concurrents grpc; do
            echo "::group::appsettings.$environment.json"
            dotnet src/Sirocco.Host/bin/Release/net10.0/Sirocco.Host.dll \
              --contentRoot "$PWD/docs/examples/config" --environment "$environment"
            echo "::endgroup::"
          done
        env:
          ASPNETCORE_URLS: http://localhost:5299

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le depot
        uses: actions/checkout@v4

      - name: Installer .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Installer DocFX
        run: dotnet tool install -g docfx

      - name: Construire le site de documentation
        # --warningsAsErrors : DocFX signale les liens de fichier invalides (InvalidFileLink) et
        # les ancres inexistantes (InvalidBookmark) — verifie en en cassant un exprès. Un lien
        # mort dans la doc casse donc le build, au lieu de pourrir en silence.
        run: docfx build docs/docfx.json --warningsAsErrors
