# Demonstration du mode distribue (Master/Workers) en conteneurs : une cible, un maitre, deux
# workers. Les process se joignent par nom de service Docker (DNS interne du reseau compose),
# pas par adresse IP — c'est ce qui rend Worker__SelfUrl stable d'un demarrage a l'autre.
#
#   docker compose up --build --exit-code-from master
#
# Le maitre s'arrete seul une fois le tir termine (Sirocco__ExitAfterRun=true) ; les workers
# restent actifs (services long-vivants, comme en production) — "docker compose down" pour
# tout arreter.
#
# Le secret de cluster (SIROCCO_CLUSTER_SHARED_SECRET) se surcharge via un fichier .env a la
# racine (ignore par git, voir .env.example) — ne jamais remplacer la valeur par defaut ci-dessous
# directement dans ce fichier pour un usage reel.

services:
  sampletarget:
    build:
      context: .
      dockerfile: samples/Sirocco.SampleTarget/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:5281
      SampleTarget__GrpcPort: "5287"
    ports:
      - "5281:5281"

  master:
    build:
      context: .
      dockerfile: src/Sirocco.Host/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:5299
      Sirocco__Role: master
      Sirocco__TargetBaseUrl: http://sampletarget:5281
      Sirocco__MaxVirtualUsers: "20"
      Sirocco__ExitAfterRun: "true"
      Sirocco__ClusterSharedSecret: "${SIROCCO_CLUSTER_SHARED_SECRET:-demo-cluster-secret-a-ne-jamais-reutiliser}"
      Sirocco__Profile__0__FromRps: "0"
      Sirocco__Profile__0__ToRps: "10"
      Sirocco__Profile__0__DurationSeconds: "10"
      Sirocco__Profile__1__FromRps: "10"
      Sirocco__Profile__1__ToRps: "10"
      Sirocco__Profile__1__DurationSeconds: "15"
      Sirocco__Profile__2__FromRps: "10"
      Sirocco__Profile__2__ToRps: "0"
      Sirocco__Profile__2__DurationSeconds: "5"
      Master__ExpectedWorkers: "2"
      Master__RegistrationTimeoutSeconds: "30"
    ports:
      - "5299:5299"
    depends_on:
      - sampletarget

  worker1:
    build:
      context: .
      dockerfile: src/Sirocco.Host/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:5300
      Sirocco__Role: worker
      Sirocco__TargetBaseUrl: http://sampletarget:5281
      Sirocco__ClusterSharedSecret: "${SIROCCO_CLUSTER_SHARED_SECRET:-demo-cluster-secret-a-ne-jamais-reutiliser}"
      Worker__MasterUrl: http://master:5299
      Worker__SelfUrl: http://worker1:5300
    depends_on:
      - sampletarget
      - master

  worker2:
    build:
      context: .
      dockerfile: src/Sirocco.Host/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:5300
      Sirocco__Role: worker
      Sirocco__TargetBaseUrl: http://sampletarget:5281
      Sirocco__ClusterSharedSecret: "${SIROCCO_CLUSTER_SHARED_SECRET:-demo-cluster-secret-a-ne-jamais-reutiliser}"
      Worker__MasterUrl: http://master:5299
      Worker__SelfUrl: http://worker2:5300
    depends_on:
      - sampletarget
      - master
