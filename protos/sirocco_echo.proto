syntax = "proto3";

option csharp_namespace = "Sirocco.Protos.Echo";

package sirocco.echo;

// Contrats de reference pour le protocole gRPC : un appel unaire (Ping), les trois formes de
// streaming (serveur, client, bidirectionnel). Fichier unique reference par Sirocco.Scenarios
// (client), Sirocco.SampleTarget (serveur) et Sirocco.UnitTests (serveur, pour les tests) afin
// qu'un desaccord de contrat echoue a la compilation plutot qu'a l'execution.
service EchoService {
  rpc Ping (PingRequest) returns (PingResponse);
  rpc StreamEcho (StreamEchoRequest) returns (stream StreamEchoMessage);
  rpc ClientStreamEcho (stream ClientStreamMessage) returns (ClientStreamSummary);
  rpc BidiStreamEcho (stream BidiStreamMessage) returns (stream BidiStreamMessage);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
}

message StreamEchoRequest {
  string message = 1;
}

// Le nombre de messages envoyes est decide par le serveur, pas par le client — un client
// realiste ne dicte pas le comportement d'un flux auquel il s'abonne, il lit jusqu'a ce que
// le serveur cesse d'emettre.
message StreamEchoMessage {
  string message = 1;
  int32 sequence = 2;
}

// Ici a l'inverse, c'est le client qui decide du nombre de messages envoyes (upload) : le
// serveur se contente d'accumuler jusqu'a la fermeture du flux.
message ClientStreamMessage {
  string message = 1;
  int32 sequence = 2;
}

message ClientStreamSummary {
  int32 messageCount = 1;
  int32 totalBytes = 2;
}

// Reutilise pour les deux sens du flux bidirectionnel : le serveur echo chaque message recu,
// dans l'ordre, sur son propre flux de sortie.
message BidiStreamMessage {
  string message = 1;
  int32 sequence = 2;
}
